<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Navpreet Kaur · A Royal Book</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#021a22;--gold:#f4d37a;--teal:#0b6e75;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:'Cinzel',Georgia,serif;color:#fff}
.sc{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 1.1s}
.sc.on{opacity:1;pointer-events:auto}
#s1{background:radial-gradient(circle at 50% 40%,#0d5560,#021a22 70%);perspective:1400px;display:flex;align-items:center;justify-content:center}
.book{--w:min(76vw,330px);width:var(--w);height:calc(var(--w)*1.4);position:relative;transform-style:preserve-3d;transform:rotateX(8deg) rotateY(-24deg);animation:fl 5s ease-in-out infinite;transition:transform 1.8s}
@keyframes fl{50%{translate:0 -12px}}
.book.open{transform:translateX(29%) scale(.58) rotateX(0) rotateY(0);animation:none}
.pg{position:absolute;inset:0;background:#f6edd2;border-radius:2px 8px 8px 2px}
.inner{display:flex;align-items:center;justify-content:center;text-align:center;color:#0b4f57;padding:14%;font-size:4.5vw;background:linear-gradient(90deg,#e6d8ae,#f6edd2 20%)}
.cover{position:absolute;inset:0;transform-origin:left;transform-style:preserve-3d;transition:transform 1.9s cubic-bezier(.6,0,.2,1)}
.book.open .cover{transform:rotateY(-172deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:2px 10px 10px 2px;overflow:hidden;box-shadow:0 30px 60px #000a}
.face.f{container-type:inline-size;transform:translateZ(6px);background:#06424d}
.face.b{transform:rotateY(180deg) translateZ(6px);background:#0b4f57}
.face svg.bg{position:absolute;inset:0;width:100%;height:100%}
.doll{position:absolute;right:2%;bottom:3%;height:80%;width:auto;animation:sw 4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes sw{50%{transform:rotate(1.6deg)}}
.hair{transform-origin:50% 12%;animation:hr 3s ease-in-out infinite}
@keyframes hr{50%{transform:rotate(2.5deg)}}
#name{position:absolute;left:5%;top:30%;background:none;border:0;padding:0;cursor:pointer;font-family:'Great Vibes',cursive;font-size:19cqw;line-height:.95;text-align:left;color:var(--gold);text-shadow:0 0 14px #f4d37a99,0 3px 4px #000;animation:gl 2.2s ease-in-out infinite}
@keyframes gl{50%{text-shadow:0 0 28px #fff,0 3px 4px #000;transform:scale(1.04)}}
#name small{display:block;font:600 3.6cqw 'Cinzel',serif;letter-spacing:.2em;margin-top:8%;color:#fff;opacity:.85}
.spine{position:absolute;left:-10px;top:0;bottom:0;width:12px;background:#042f37;transform:rotateY(-90deg);transform-origin:right}
#s2{background:radial-gradient(circle at 50% 30%,#0d5560,#021a22 75%)}
#cv{width:100%;height:100%;display:block}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;pointer-events:none;font-size:15px;letter-spacing:.12em;text-shadow:0 2px 6px #000}
.top b{display:block;color:var(--gold);font-size:12px;margin-top:4px;opacity:.9;font-weight:600}
#bub{position:absolute;left:5%;right:5%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:#fff;color:#1b3a40;border-radius:18px;padding:16px 18px;font:15px/1.5 Georgia,serif;box-shadow:0 10px 30px #0008;opacity:0;transform:translateY(20px);transition:.6s;max-width:520px;margin:auto}
#bub.on{opacity:1;transform:none}
#bub i{display:block;margin-top:8px;color:#0b6e75;font-size:13px;animation:gl 1.4s infinite}
#toast{position:absolute;top:45%;left:0;right:0;text-align:center;font-size:9vw;color:var(--gold);text-shadow:0 0 20px #000;opacity:0;transition:.5s;pointer-events:none}
#s3{background:linear-gradient(#a9e4f5,#dff6ff 50%,#ffe9cc)}
#rp{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:#0003;border:1px solid #fff6;color:#fff;border-radius:20px;padding:8px 14px;font:13px Georgia;cursor:pointer;opacity:0;transition:1s}
#mt{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);background:#fff8;border:1px solid #0b6e7566;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;z-index:3}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
</style></head><body>

</section>

<section class="sc" id="s2">
 <div class="top">PAGE 1 · CHECKMATE IN ONE<b id="hint">Tap the white rook, then choose its square</b></div>
 <div id="cv"></div><div id="toast">Checkmate!</div>
 <div id="bub"><span id="tx"></span><i id="tp" style="display:none">♔ touch the king to continue</i></div>
</section>

<section class="sc" id="s3"><button id="mt" aria-label="Mute music">🔊</button><button id="rp">↻ replay birds</button></section>
<canvas id="fx"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),W=()=>innerWidth,H=()=>innerHeight;
const fx=$('#fx'),c=fx.getContext('2d');let DPR=Math.min(1.5,devicePixelRatio||1);
function rs(){fx.width=W()*DPR;fx.height=H()*DPR;c.setTransform(DPR,0,0,DPR,0,0)}rs();addEventListener('resize',rs);
const show=id=>{document.querySelectorAll('.sc').forEach(s=>s.classList.toggle('on',s.id===id))};
function wing(x,y,s,f,q=c){q.moveTo(x-s,y+f*s*.5);q.quadraticCurveTo(x-s*.4,y-s*.5,x,y);q.quadraticCurveTo(x+s*.4,y-s*.5,x+s,y+f*s*.5)}
let BK=[null,null],BT=[0,0];
function bake(gi){const k=document.createElement('canvas');k.width=W()*DPR;k.height=H()*DPR;const x=k.getContext('2d');x.scale(DPR,DPR);x.lineWidth=1.7;x.lineCap='round';for(const col of PAL){x.strokeStyle=col;x.beginPath();for(const b of sk)if(b.g===gi&&b.col===col)wing(b.tx,b.ty,b.s,.25,x);x.stroke()}return k}
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;

/* birds */
const PAL=['#047a38','#0a2fb0','#00796b','#1356d6'];let GL=[],ST=0,mode=null,fl=[],sk=[],clouds=[],T0=0,midcb=null,midAt=0,flDur=0;
function fly(dur,mid){mode=mode==='sky'?'sky':'fly';flDur=dur;T0=performance.now();midcb=mid;
 fl=[...Array(46)].map(()=>({d:Math.random()*.35,y:H()*(.25+Math.random()*.65),sp:.7+Math.random()*.5,a:6+Math.random()*26,ph:Math.random()*6,s:7+Math.random()*13}))}
const flying=()=>fl.length>0;
function drawFly(now){const t=(now-T0)/flDur;if(midcb&&t>.45){const f=midcb;midcb=null;f()}
 if(t>1.4){fl=[];return}
 c.strokeStyle='#5ef0c0';c.lineWidth=2;c.lineCap='round';c.beginPath();
 for(const b of fl){const p=(t*b.sp*1.5-b.d);if(p<0)continue;const x=-40+p*(W()+80),y=b.y-p*H()*.28+Math.sin(p*11+b.ph)*b.a;wing(x,y,b.s,Math.sin(now/70+b.ph))}
 c.stroke()}

/* sky page */
function mkSky(){sk=[];const w=W(),h=H(),port=w<700;
 const g1=port?['happy','birthday','Navpreet','Kaur']:['happy birthday','Navpreet Kaur'],g2=port?['october','mate','from sajid']:['october mate','from sajid'];
 const m=document.createElement('canvas').getContext('2d');m.font='900 100px "Arial Black",Arial';
 const mw=Math.max(...[...g1,...g2].map(t=>m.measureText(t).width));
 const nr=g1.length+g2.length,fs=Math.min(w*.94/mw*100,h*.8/(nr*1.3+1.2)),step=Math.max(3,Math.round(fs/15));
 GL=[0,1].map(()=>{const k=document.createElement('canvas');k.width=w;k.height=h;return k});
 [[g1,h*.06,0,'#fff'],[g2,h*.06+fs*1.3*(g1.length)+fs*.5,6000,'#ffe08a']].forEach(([rows,y0,delay,col],gi)=>{const gx=GL[gi].getContext('2d');gx.font='900 '+fs+'px "Arial Black",Arial';gx.textAlign='center';gx.textBaseline='middle';gx.fillStyle='#fff';gx.shadowColor='#fff';gx.shadowBlur=fs*.45;gx.lineWidth=fs*.12;gx.strokeStyle='#fff';gx.lineJoin='round';rows.forEach((r,i)=>{for(let k=0;k<2;k++){gx.strokeText(r,w/2,y0+i*fs*1.3+fs*.65);gx.fillText(r,w/2,y0+i*fs*1.3+fs*.65)}});
  rows.forEach((r,i)=>{const o=document.createElement('canvas');o.width=Math.ceil(w);o.height=Math.ceil(fs*1.3);const x=o.getContext('2d');
   x.font='900 '+fs+'px "Arial Black",Arial';x.lineWidth=fs*.05;x.lineJoin='round';x.textAlign='center';x.textBaseline='middle';x.fillText(r,w/2,fs*.65);x.strokeText(r,w/2,fs*.65);
   const d=x.getImageData(0,0,o.width,o.height).data;
   for(let py=step>>1;py<o.height;py+=step)for(let px=step>>1;px<o.width;px+=step)if(d[(py*o.width+px)*4+3]>110){
    const e=Math.floor(Math.random()*4),sx=e<2?(e?w+30:-30):Math.random()*w,sy=e<2?Math.random()*h:(e==2?-30:h+30);
    sk.push({tx:px,ty:y0+i*fs*1.3+py,sx,sy,g:gi,col:PAL[Math.floor(Math.random()*4)],d:delay+Math.random()*1800,ph:Math.random()*6,s:step*.62})}})});
 ST=performance.now();BK=[null,null];BT=[0,0];sk.forEach(b=>{BT[b.g]=Math.max(BT[b.g],b.d+3200)});clouds=[...Array(7)].map((_,i)=>({x:Math.random()*w,y:h*(.1+Math.random()*.8),r:50+Math.random()*70,v:.15+Math.random()*.3,z:.4+Math.random()*.8}));}
function drawSky(now){const w=W(),h=H(),t=now-ST;
 const sg=c.createRadialGradient(w*.8,h*.82,5,w*.8,h*.82,h*.5);sg.addColorStop(0,'#fff3b0cc');sg.addColorStop(1,'#fff8d000');c.fillStyle=sg;c.fillRect(0,0,w,h);
 for(const k of clouds){k.x+=k.v*k.z;if(k.x>w+k.r*2)k.x=-k.r*2;c.globalAlpha=.9*k.z;c.fillStyle='#fff';
  for(let j=0;j<4;j++){c.beginPath();c.arc(k.x+j*k.r*.6,k.y+(j%2)*-k.r*.2,k.r*(.6+.15*(j%3))*k.z,0,7);c.fill()}}
 c.globalAlpha=Math.min(1,Math.max(0,(t-3500)/1500));if(GL[0])c.drawImage(GL[0],0,0,w,h);c.globalAlpha=Math.min(1,Math.max(0,(t-9500)/1500));if(GL[1])c.drawImage(GL[1],0,0,w,h);c.globalAlpha=1;c.lineWidth=1.7;c.lineCap='round';
 const bob=Math.sin(now/900)*1.2;for(let g=0;g<2;g++){if(!BK[g]&&t>BT[g])BK[g]=bake(g);if(BK[g])c.drawImage(BK[g],0,bob,w,h)}
 for(const col of PAL){c.strokeStyle=col;c.beginPath();
  for(const b of sk){if(b.col!==col||BK[b.g])continue;const q=(t-b.d)/2800;if(q<0)continue;const e=ease(Math.min(1,q));
   let x=b.sx+(b.tx-b.sx)*e,y=b.sy+(b.ty-b.sy)*e;if(q<1){x+=Math.sin(q*9+b.ph)*(1-e)*40;y+=Math.cos(q*7+b.ph)*(1-e)*30}
   else{x+=Math.sin(now/600+b.ph)*.3;y+=Math.cos(now/700+b.ph)*.3}
   wing(x,y,b.s,(q<1?1:.2)*Math.sin(now/(q<1?60:300)+b.ph))}c.stroke()}
 if(t>11000)$('#rp').style.opacity=1}

function loop(now){c.clearRect(0,0,W(),H());
 if(mode==='sky')drawSky(now);if(fl.length)drawFly(now);
 tick(now);requestAnimationFrame(loop)}

/* step 1 */
let opened=false;
$('#name').onclick=()=>{if(opened)return;opened=true;ensureAudio();fly(2600);
 setTimeout(()=>$('#book').classList.add('open'),700);
 setTimeout(()=>{show('s2');initChess()},5200)};

/* step 2: chess */
const tw=[];function tween(d,f,done){tw.push({t:performance.now(),d,f,done})}
let R,S,C,pcs=[],sel=null,state='play',raycaster,kingW,sq={};
function tick(now){for(let i=tw.length-1;i>=0;i--){const a=tw[i],p=Math.min(1,(now-a.t)/a.d);a.f(ease(p));if(p>=1){tw.splice(i,1);a.done&&a.done()}}
 if(R&&$('#s2').classList.contains('on')){board.rotation.y=Math.sin(now/3000)*.03;R.render(S,C)}}
let board;
const P=(f,r)=>new THREE.Vector3(f-3.5,0,3.5-r);
function lathe(pts,col){return new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),24),col)}
function mat(w){return new THREE.MeshStandardMaterial({color:w?0xf6efdc:0x0a2230,metalness:w?.2:.5,roughness:w?.35:.3,emissive:w?0x221c0a:0x04302f})}
function piece(t,w,f,r){const g=new THREE.Group(),m=mat(w),base=[[0,0],[.34,0],[.34,.08],[.22,.2],[.17,.6],[.27,.68],[0,.68]];
 g.add(lathe(base,m));
 if(t==='P'){const s=new THREE.Mesh(new THREE.SphereGeometry(.2,20,16),m);s.position.y=.8;g.add(s)}
 if(t==='R'){const k=new THREE.Mesh(new THREE.CylinderGeometry(.3,.26,.28,20),m);k.position.y=.82;g.add(k);
  for(let i=0;i<4;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(.12,.14,.12),m);const a=i*Math.PI/2;b.position.set(Math.cos(a)*.22,1.03,Math.sin(a)*.22);g.add(b)}}
 if(t==='K'){const s=new THREE.Mesh(new THREE.SphereGeometry(.24,24,18),m);s.position.y=.95;g.add(s);
  const b1=new THREE.Mesh(new THREE.BoxGeometry(.07,.36,.07),m),b2=new THREE.Mesh(new THREE.BoxGeometry(.24,.07,.07),m);b1.position.y=1.38;b2.position.y=1.42;g.add(b1,b2);g.scale.setScalar(1.12)}
 g.userData={sq:[f,r],t,w};g.position.copy(P(f,r));g.position.y=.08;S.add(g);pcs.push(g);return g}
function initChess(){if(R)return;S=new THREE.Scene();C=new THREE.PerspectiveCamera(45,W()/H(),.1,100);
 R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(DPR);R.setSize(W(),H());$('#cv').appendChild(R.domElement);
 const fit=()=>{const a=W()/H(),d=Math.max(12,9.6/(.83*a));C.aspect=a;C.position.set(0,.78*d,.62*d);C.lookAt(0,.2,0);C.updateProjectionMatrix();R.setSize(W(),H())};fit();addEventListener('resize',fit);
 S.add(new THREE.AmbientLight(0xffffff,.65));const dl=new THREE.DirectionalLight(0xfff0d0,.9);dl.position.set(4,10,6);S.add(dl);const pl=new THREE.PointLight(0x2de0c8,.8,30);pl.position.set(-5,5,-4);S.add(pl);
 board=new THREE.Group();S.add(board);
 const fr=new THREE.Mesh(new THREE.BoxGeometry(8.7,.3,8.7),new THREE.MeshStandardMaterial({color:0xc99a2e,metalness:.7,roughness:.3}));fr.position.y=-.2;board.add(fr);
 for(let f=0;f<8;f++)for(let r=0;r<8;r++){const m=new THREE.Mesh(new THREE.BoxGeometry(1,.12,1),new THREE.MeshStandardMaterial({color:(f+r)%2?0xeedcaa:0x0e8a86,roughness:.5}));m.position.copy(P(f,r));m.userData.sq=[f,r];m.userData.tile=1;board.add(m);sq[f+','+r]=m}
 S.add(board);
 const add=(t,w,f,r)=>{const p=piece(t,w,f,r);S.remove(p);board.add(p);return p};
 pcs=[];kingW=add('K',1,6,0);add('R',1,0,0);[5,6,7].forEach(f=>add('P',1,f,1));add('K',0,6,7);[5,6,7].forEach(f=>add('P',0,f,6));
 raycaster=new THREE.Raycaster();
 R.domElement.addEventListener('pointerdown',e=>{const m=new THREE.Vector2(e.clientX/W()*2-1,-e.clientY/H()*2+1);raycaster.setFromCamera(m,C);
  const hit=raycaster.intersectObjects(board.children,true)[0];if(!hit)return;let o=hit.object;while(o&&!o.userData.sq&&!o.userData.t)o=o.parent;if(!o)return;
  if(state==='king'){if(o===kingW)goSky();return}
  if(state!=='play')return;
  const [f,r]=o.userData.sq,rook=pcs.find(p=>p.userData.t==='R');
  if(o===rook){sel=!sel;rook.position.y=sel?.5:.08;$('#hint').textContent=sel?'Now tap the square for checkmate':'Tap the white rook, then choose its square';return}
  if(!sel)return;
  if(f===0&&r===7)mate(rook);else{sel=false;rook.position.y=.08;$('#hint').textContent='Not mate — the king is boxed in by his own pawns. Look at the back rank!'}})}

function mate(rook){state='anim';sel=false;const a=rook.position.clone(),b=P(0,7);$('#hint').textContent='';
 tween(900,p=>{rook.position.set(a.x+(b.x-a.x)*p,.5+Math.sin(p*Math.PI)*.8,a.z+(b.z-a.z)*p)},()=>{rook.position.y=.08;
  const t=$('#toast');t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1400);
  setTimeout(()=>{const dead=pcs.filter(p=>p!==kingW);
   tween(700,p=>dead.forEach(d=>{d.rotation.x=p*.9}),()=>tween(900,p=>dead.forEach(d=>{d.scale.setScalar(Math.max(.001,1-p));d.position.y=.08+p*1.2;d.rotation.y=p*6}),()=>{dead.forEach(d=>board.remove(d));crown()}))},1000)})}

function crown(){const s=document.createElement('canvas');s.width=s.height=128;const x=s.getContext('2d');x.fillStyle='#102a33';
 x.beginPath();x.ellipse(44,56,7,10,0,0,7);x.ellipse(84,56,7,10,0,0,7);x.fill();x.fillStyle='#fff';x.fillRect(42,50,3,3);x.fillRect(82,50,3,3);
 x.strokeStyle='#102a33';x.lineWidth=5;x.lineCap='round';x.beginPath();x.arc(64,70,24,.15*Math.PI,.85*Math.PI);x.stroke();x.fillStyle='#ff8fa3aa';x.beginPath();x.arc(30,78,7,0,7);x.arc(98,78,7,0,7);x.fill();
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(s),transparent:true}));sp.scale.set(.6,.6,1);sp.position.set(0,.95,.3);kingW.add(sp);
 const a=kingW.position.clone();
 tween(1600,p=>{kingW.position.set(a.x*(1-p),.08+p*.5+Math.sin(p*3.14)*.4,a.z*(1-p)+p*.8);kingW.scale.setScalar(1.12+p*1.3);kingW.rotation.y=p*6.28},()=>{state='king';
  const b=$('#bub');b.classList.add('on');const msg='The crown is yours just like the family crown u carry being eldest child, may you always carry your crown with grace Navpreet Kaur. Please proceed further by touching king',tx=$('#tx');let i=0;
  const ty=setInterval(()=>{tx.textContent=msg.slice(0,++i);if(i>=msg.length){clearInterval(ty);$('#tp').style.display='block'}},38);
  b.onclick=goSky;
  tween(1e9,p=>{kingW.position.y=.58+Math.sin(performance.now()/500)*.08;kingW.rotation.y=Math.sin(performance.now()/900)*.25})})}

function goSky(){if(state==='sky')return;state='sky';ensureAudio();fly(2600,()=>{show('s3');mode='sky';mkSky();playBday();$('#rp').style.opacity=0});}
$('#rp').onclick=()=>{$('#rp').style.opacity=0;mkSky();playBday()};
let lw=0;addEventListener('resize',()=>{if(mode==='sky'&&Math.abs(W()-lw)>60){lw=W();mkSky()}});

/* birthday music (instrumental, music-box style) */
let AC,mg,muted=false,mTimer;
function ensureAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function note(f,t,d,v,out){const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+d);g.connect(out);
 [[f,'sine',1],[f*2,'triangle',.3],[f*3,'sine',.12]].forEach(([fr,ty,a])=>{const o=AC.createOscillator(),k=AC.createGain();o.type=ty;o.frequency.value=fr;k.gain.value=a;o.connect(k);k.connect(g);o.start(t);o.stop(t+d+.05)})}
function playBday(){ensureAudio();if(!AC)return;clearTimeout(mTimer);if(mg){mg.gain.cancelScheduledValues(AC.currentTime);mg.gain.setTargetAtTime(0,AC.currentTime,.1)}
 mg=AC.createGain();mg.gain.value=muted?0:.55;mg.connect(AC.destination);
 const B=.56,S=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],[392,.75],[392,.25],[784,1],[659.25,1],[523.25,1],[493.88,1],[440,1],[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
 let t=AC.currentTime+.4;const t0=t;
 S.forEach(([f,b])=>{note(f,t,Math.max(1.1,b*B*2),.32,mg);t+=b*B});
 [[130.81,0],[98,6],[130.81,12],[174.61,18]].forEach(([f,b])=>{const tt=t0+b*B;[1,1.26,1.5].forEach(m=>note(f*m*2,tt,b===18?3.4:3.3,.09,mg))});
 mTimer=setTimeout(playBday,(t-AC.currentTime)*1000+2500)}
$('#mt').onclick=()=>{muted=!muted;$('#mt').textContent=muted?'🔇':'🔊';if(mg)mg.gain.value=muted?0:.55};
requestAnimationFrame(loop);
</script></body></html>
